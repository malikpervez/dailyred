# Daily Red as a Discord Activity. Setup: docs/discord-activity.md
#
#   docker compose up -d --build     # then try it in a browser: http://<pi-ip>:8380
#
# For Discord: cp .env.example .env, fill it in, and run the same command (behind
# your own reverse proxy), or with a Cloudflare Tunnel:
#   docker compose --profile tunnel up -d --build
services:
  dailyred:
    build:
      context: .
    image: dailyred-activity:local
    container_name: dailyred
    restart: unless-stopped
    environment:
      # From .env. Without them the site still works in a browser (stats in
      # the browser, as on the website); only Discord sign-in needs them.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    ports:
      # For a reverse proxy on the Pi. Not needed with the tunnel below.
      - "${DAILYRED_PORT:-8380}:8080"
    volumes:
      # Players' stats (one SQLite file). To keep it in an OMV shared folder
      # instead, use e.g. /srv/dev-disk-by-uuid-.../appdata/dailyred:/data and
      # give the container's user access to it: sudo chown 1000:1000 <folder>
      - dailyred-data:/data

  # Optional: makes the Pi reachable by Discord over HTTPS without opening a
  # port on your router. Start with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    container_name: dailyred-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - dailyred

volumes:
  dailyred-data:
